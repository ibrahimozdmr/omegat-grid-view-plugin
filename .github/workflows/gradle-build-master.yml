name: Gradle build

on:
  push:
    branches:
      - main
      - master
      - releases/*
  pull_request:

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Build plugin JAR
        run: ./gradlew jar
