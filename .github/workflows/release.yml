name: Release

# Pushing a tag such as v1.0.1 builds the plugin JAR and publishes a GitHub
# release with it, using the matching section of CHANGELOG.md as notes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Check that the tag matches the plugin version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          if [ "$TAG_VERSION" != "$BUILD_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $BUILD_VERSION in build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Build plugin JAR
        run: ./gradlew jar

      - name: Take release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/omegat-gridview-plugin-$VERSION.jar" \
            --title "Grid View $VERSION" \
            --notes-file release-notes.md
